<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק החיות הקסום של עומר</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Fredoka+One:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Varela Round', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* רקע מאנימציה עם צורות צבעוניות */
        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            opacity: 0.3;
            animation: float 6s ease-in-out infinite;
        }

        .shape:nth-child(1) {
            top: 10%;
            left: 10%;
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            border-radius: 50%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            top: 20%;
            right: 15%;
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #48dbfb, #0abde3);
            border-radius: 20px;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            bottom: 20%;
            left: 20%;
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #ff9ff3, #f368e0);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            animation-delay: 4s;
        }

        .shape:nth-child(4) {
            bottom: 30%;
            right: 10%;
            width: 70px;
            height: 70px;
            background: linear-gradient(45deg, #7bed9f, #2ed573);
            border-radius: 50%;
            animation-delay: 1s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        /* כוכבים מרקדים */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .star {
            position: absolute;
            color: #ffd700;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .container {
            position: relative;
            z-index: 1;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 3.5rem;
            text-align: center;
            color: #fff;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            animation: bounce 2s infinite;
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: bounce 2s infinite, gradient 4s ease infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .mute-button {
            display: block;
            margin: 0 auto 40px auto;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 16px rgba(255, 107, 107, 0.3);
            font-family: 'Varela Round', sans-serif;
        }

        .mute-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(255, 107, 107, 0.4);
        }

        .mute-button:active {
            transform: translateY(0);
        }

        .question-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .question-btn {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(45deg, #48dbfb, #0abde3);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 12px rgba(72, 219, 251, 0.3);
            font-family: 'Varela Round', sans-serif;
        }

        .question-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 16px rgba(72, 219, 251, 0.4);
        }

        .animal-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .animal-box {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 20px;
            text-align: center;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .animal-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s ease;
        }

        .animal-box:hover::before {
            left: 100%;
        }

        .animal-box:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .animal-image {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            cursor: pointer;
            object-fit: cover;
            border: 5px solid #fff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .animal-image:hover {
            transform: rotate(5deg) scale(1.1);
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
        }

        .animal-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-top: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .animal-icon {
            font-size: 24px;
            margin-bottom: 10px;
            color: #ff6b6b;
        }

        /* אנימציות עם צליל */
        .playing {
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* אפקטים מיוחדים */
        .sparkle {
            position: absolute;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #ffd700 0%, transparent 70%);
            border-radius: 50%;
            animation: sparkle 1s ease-out forwards;
        }

        @keyframes sparkle {
            0% {
                opacity: 1;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0);
            }
        }

        /* רספונסיבי */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .animal-container {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 20px;
            }
            
            .animal-image {
                width: 120px;
                height: 120px;
            }
            
            .animal-box {
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }
            
            .animal-container {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .animal-image {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="stars" id="stars"></div>

    <div class="container">
        <h1><i class="fas fa-paw"></i> משחק החיות הקסום של עומר <i class="fas fa-paw"></i></h1>

        <button class="mute-button" onclick="muteAllSounds()">
            <i class="fas fa-volume-mute"></i> השתק את כל הקולות
        </button>

        <div class="question-container" id="questionContainer"></div>
        <div class="animal-container" id="animalContainer"></div>
    </div>

    <script>
        // יצירת כוכבים
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 20; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.innerHTML = '⭐';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(star);
            }
        }

        const animals = [
            { name: 'פיל', image: 'Elephant.jpg', sound: 'elephant_sound.mp3', question: 'elephant_question.mp3', icon: '🐘' },
            { name: 'כלב', image: 'Dog.jpg', sound: 'dog_bark.mp3', question: 'dog_question.mp3', icon: '🐕' },
            { name: 'חתול', image: 'Cat.jpg', sound: 'cat_meow.mp3', question: 'cat_question.mp3', icon: '🐱' },
            { name: 'סוס', image: 'Horse.jpg', sound: 'horse_neigh.mp3', question: 'horse_question.mp3', icon: '🐎' },
            { name: 'דג', image: 'Fish.jpg', sound: 'fish_bubble.mp3', question: 'fish_question.mp3', icon: '🐟' },
            { name: 'דוב', image: 'Bear.jpg', sound: 'bear_growl.mp3', question: 'bear_question.mp3', icon: '🐻' },
            { name: 'אריה', image: 'Lion.jpg', sound: 'lion_roar.mp3', question: 'lion_question.mp3', icon: '🦁' },
            { name: 'ג\'ירפה', image: 'Giraffe.jpg', sound: 'giraffe_munch.mp3', question: 'giraffe_question.mp3', icon: '🦒' },
            { name: 'קוף', image: 'Monkey.jpg', sound: 'monkey_chatter.mp3', question: 'monkey_question.mp3', icon: '🐒' },
            { name: 'תרנגול', image: 'Chicken.jpg', sound: 'chicken_cluck.mp3', question: 'chicken_question.mp3', icon: '🐓' },
            { name: 'פרה', image: 'Cow.jpg', sound: 'cow_moo.mp3', question: 'cow_question.mp3', icon: '🐄' },
            { name: 'תוכי', image: 'Parrot.jpg', sound: 'parrot_squawk.mp3', question: 'parrot_question.mp3', icon: '🦜' }
        ];

        function createSparkleEffect(element) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = Math.random() * 100 + '%';
            sparkle.style.top = Math.random() * 100 + '%';
            element.appendChild(sparkle);

            setTimeout(() => {
                sparkle.remove();
            }, 1000);
        }

        function createContent() {
            const animalContainer = document.getElementById('animalContainer');
            const questionContainer = document.getElementById('questionContainer');
            
            animals.forEach(animal => {
                // יצירת קופסת החיה
                const animalBox = document.createElement('div');
                animalBox.className = 'animal-box';
                animalBox.innerHTML = `
                    <div class="animal-icon">${animal.icon}</div>
                    <img src="images/${animal.image}" alt="${animal.name}" class="animal-image" onclick="playAnimalSound('${animal.name}Sound', this)">
                    <div class="animal-name">${animal.name}</div>
                    <audio id="${animal.name}Sound" src="animal_sounds/${animal.sound}"></audio>
                    <audio id="${animal.name}Question" src="sounds/${animal.question}"></audio>
                `;
                animalContainer.appendChild(animalBox);

                // יצירת כפתור שאלה
                const questionButton = document.createElement('button');
                questionButton.className = 'question-btn';
                questionButton.innerHTML = `<i class="fas fa-question-circle"></i> שאלה על ${animal.name}`;
                questionButton.onclick = () => playQuestion(`${animal.name}Question`, questionButton);
                questionContainer.appendChild(questionButton);
            });
        }

        function muteAllSounds() {
            const sounds = document.querySelectorAll('audio');
            sounds.forEach(sound => {
                sound.pause();
                sound.currentTime = 0;
            });
            
            // הסרת כל האנימציות
            document.querySelectorAll('.playing').forEach(el => {
                el.classList.remove('playing');
            });
        }

        function playAnimalSound(soundId, element) {
            muteAllSounds();
            const sound = document.getElementById(soundId);
            if (sound) {
                console.log(`Playing sound for: ${soundId}`);
                console.log(`Sound URL: ${sound.src}`);
                
                // הוספת אנימציה
                element.classList.add('playing');
                element.parentElement.style.position = 'relative';
                
                // יצירת אפקט נצנוץ
                createSparkleEffect(element.parentElement);
                
                sound.play().catch(e => {
                    console.error(`Failed to play sound: ${e}`);
                });
                
                // הסרת האנימציה אחרי זמן מסוים
                setTimeout(() => {
                    element.classList.remove('playing');
                }, 500);
            } else {
                console.error(`Sound element not found for: ${soundId}`);
            }
        }

        function playQuestion(questionId, element) {
            muteAllSounds();
            const question = document.getElementById(questionId);
            if (question) {
                console.log(`Playing question for: ${questionId}`);
                console.log(`Question URL: ${question.src}`);
                
                // הוספת אנימציה
                element.classList.add('playing');
                
                question.play().catch(e => {
                    console.error(`Failed to play question: ${e}`);
                });
                
                // הסרת האנימציה אחרי זמן מסוים
                setTimeout(() => {
                    element.classList.remove('playing');
                }, 500);
            } else {
                console.error(`Question element not found for: ${questionId}`);
            }
        }

        // טעינת כל התוכן
        window.onload = function() {
            createStars();
            createContent();
        };
    </script>
</body>
</html>
