<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק החיות של עומר - עם אפקט קפיצה מרכזי</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Rubik', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        .floating-hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .heart {
            position: absolute;
            color: #ff69b4;
            font-size: 20px;
            animation: float 6s infinite ease-in-out;
            opacity: 0.6;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        .main-container {
            position: relative;
            z-index: 2;
        }
        
        .title-glow {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .animal-box {
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }
        
        .animal-box:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .animal-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        
        .animal-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2d3748;
            margin-top: 10px;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8);
        }
        
        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            margin: 5px;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        
        .mute-button {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
        }
        
        .mute-button:hover {
            background: linear-gradient(135deg, #ee5a24 0%, #d63031 100%);
        }
        
        /* אפקט קפיצה למרכז */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .popup-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .popup-animal {
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            transform: scale(0.5);
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        .popup-overlay.active .popup-animal {
            transform: scale(1);
        }
        
        .popup-animal img {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid #667eea;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        
        .popup-animal h3 {
            font-size: 2.5rem;
            color: #667eea;
            margin: 20px 0;
            font-weight: 700;
        }
        
        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffea00;
            border-radius: 50%;
            animation: sparkle 1s infinite;
        }
        
        @keyframes sparkle {
            0%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1) rotate(180deg); opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .animal-image {
                width: 120px;
                height: 120px;
            }
            
            .popup-animal img {
                width: 200px;
                height: 200px;
            }
            
            .popup-animal h3 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="floating-hearts"></div>
    
    <div class="main-container">
        <div class="container mx-auto px-4 py-8">
            <h1 class="text-6xl font-bold text-center text-white mb-8 title-glow">
                <i class="fas fa-paw"></i> משחק החיות של עומר <i class="fas fa-heart"></i>
            </h1>

            <div class="text-center mb-8">
                <button class="button mute-button" onclick="muteAllSounds()">
                    <i class="fas fa-volume-mute"></i> השתק את כל הקולות
                </button>
            </div>

            <div class="question-container flex flex-wrap justify-center gap-4 mb-8"></div>
            
            <div class="animal-container grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 max-w-6xl mx-auto"></div>
        </div>
    </div>

    <!-- פופאפ למרכז -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-animal">
            <img id="popupImage" src="" alt="">
            <h3 id="popupName"></h3>
            <div class="sparkle" style="top: 10px; right: 10px;"></div>
            <div class="sparkle" style="bottom: 10px; left: 10px; animation-delay: 0.5s;"></div>
            <div class="sparkle" style="top: 50%; left: 10px; animation-delay: 1s;"></div>
            <div class="sparkle" style="top: 10px; left: 50%; animation-delay: 1.5s;"></div>
        </div>
    </div>

    <script>
        const animals = [
            { name: 'פיל', image: 'Elephant.jpg', sound: 'elephant_sound.mp3', question: 'elephant_question.mp3' },
            { name: 'כלב', image: 'Dog.jpg', sound: 'dog_bark.mp3', question: 'dog_question.mp3' },
            { name: 'חתול', image: 'Cat.jpg', sound: 'cat_meow.mp3', question: 'cat_question.mp3' },
            { name: 'סוס', image: 'Horse.jpg', sound: 'horse_neigh.mp3', question: 'horse_question.mp3' },
            { name: 'דג', image: 'Fish.jpg', sound: 'fish_bubble.mp3', question: 'fish_question.mp3' },
            { name: 'דוב', image: 'Bear.jpg', sound: 'bear_growl.mp3', question: 'bear_question.mp3' },
            { name: 'אריה', image: 'Lion.jpg', sound: 'lion_roar.mp3', question: 'lion_question.mp3' },
            { name: 'ג\'ירפה', image: 'Giraffe.jpg', sound: 'giraffe_munch.mp3', question: 'giraffe_question.mp3' },
            { name: 'קוף', image: 'Monkey.jpg', sound: 'monkey_chatter.mp3', question: 'monkey_question.mp3' },
            { name: 'תרנגול', image: 'Chicken.jpg', sound: 'chicken_cluck.mp3', question: 'chicken_question.mp3' },
            { name: 'פרה', image: 'Cow.jpg', sound: 'cow_moo.mp3', question: 'cow_question.mp3' },
            { name: 'תוכי', image: 'Parrot.jpg', sound: 'parrot_squawk.mp3', question: 'parrot_question.mp3' }
        ];

        function createStars() {
            const starsContainer = document.querySelector('.stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(star);
            }
        }

        function createHearts() {
            const heartsContainer = document.querySelector('.floating-hearts');
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '♥';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.top = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 6 + 's';
                heartsContainer.appendChild(heart);
            }
        }

        function createContent() {
            const animalContainer = document.querySelector('.animal-container');
            const questionContainer = document.querySelector('.question-container');
            
            animals.forEach(animal => {
                const animalBox = document.createElement('div');
                animalBox.className = 'animal-box bg-white rounded-3xl p-6 text-center shadow-lg';
                animalBox.innerHTML = `
                    <img src="images/${animal.image}" alt="${animal.name}" class="animal-image mx-auto" onclick="showAnimalPopup('${animal.name}', 'images/${animal.image}', '${animal.name}Sound')">
                    <div class="animal-name">${animal.name}</div>
                    <audio id="${animal.name}Sound" src="animal_sounds/${animal.sound}"></audio>
                    <audio id="${animal.name}Question" src="sounds/${animal.question}"></audio>
                `;
                animalContainer.appendChild(animalBox);

                const questionButton = document.createElement('button');
                questionButton.className = 'button';
                questionButton.innerHTML = `<i class="fas fa-question-circle"></i> שאלה על ${animal.name}`;
                questionButton.onclick = () => playQuestion(`${animal.name}Question`);
                questionContainer.appendChild(questionButton);
            });
        }

        function showAnimalPopup(name, imageSrc, soundId) {
            const popup = document.getElementById('popupOverlay');
            const popupImage = document.getElementById('popupImage');
            const popupName = document.getElementById('popupName');
            
            popupImage.src = imageSrc;
            popupName.textContent = name;
            
            popup.classList.add('active');
            
            // נגן את הצליל
            playAnimalSound(soundId);
            
            // החזר את הפופאפ אחרי 5 שניות
            setTimeout(() => {
                popup.classList.remove('active');
            }, 5000);
        }

        function muteAllSounds() {
            const sounds = document.querySelectorAll('audio');
            sounds.forEach(sound => {
                sound.pause();
                sound.currentTime = 0;
            });
        }

        function playAnimalSound(soundId) {
            muteAllSounds();
            const sound = document.getElementById(soundId);
            if (sound) {
                console.log(`Playing sound for: ${soundId}`);
                console.log(`Sound URL: ${sound.src}`);
                sound.play().catch(e => console.error(`Failed to play sound: ${e}`));
            } else {
                console.error(`Sound element not found for: ${soundId}`);
            }
        }

        function playQuestion(questionId) {
            muteAllSounds();
            const question = document.getElementById(questionId);
            if (question) {
                console.log(`Playing question for: ${questionId}`);
                console.log(`Question URL: ${question.src}`);
                question.play().catch(e => console.error(`Failed to play question: ${e}`));
            } else {
                console.error(`Question element not found for: ${questionId}`);
            }
        }

        // סגירה בלחיצה על הרקע
        document.getElementById('popupOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('active');
            }
        });

        window.onload = function() {
            createStars();
            createHearts();
            createContent();
        };
    </script>
</body>
</html>
